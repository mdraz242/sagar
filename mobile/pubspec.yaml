name: vyparhub_mobile
description: Flutter migration of VyparHub FMCG ordering app.
publish_to: 'none'
version: 1.0.2+14

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.4
  google_fonts: ^6.2.1
  razorpay_flutter: ^1.4.5
  flutter_local_notifications: ^22.0.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  share_plus: ^12.0.2
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/
    - assets/images/products/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_monochrome: assets/branding/app_icon_monochrome.png
  min_sdk_android: 23

flutter_native_splash:
  color: "#1A2E5C"
  image: assets/branding/splash_logo.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#1A2E5C"
    image: assets/branding/app_icon_foreground.png

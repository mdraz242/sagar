services:
  postgres:
    image: postgres:16
    container_name: vyparhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vyparhub
    ports:
      - "55433:5432"
    volumes:
      - vyparhub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vyparhub"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  vyparhub-postgres-data:

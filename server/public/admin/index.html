<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VyparHub Admin</title>
  <meta name="theme-color" content="#071a3d" />
  <meta name="description" content="VyparHub internal admin portal for orders, products, categories, customers and reports." />
  <link rel="manifest" href="/admin/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/admin/icons/admin-icon.png" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --navy: #071a3d;
      --blue: #022ea7;
      --orange: #fe8501;
      --red: #fb3a02;
      --ink: #0c0728;
      --muted: #656b93;
      --bg: #f7f9fc;
      --line: #e8edf6;
      --green: #1daa61;
      --cream: #f8dfc7;
      --shadow: 0 14px 38px rgba(12, 7, 40, .08);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 20%, rgba(254, 133, 1, .16), transparent 30%),
        radial-gradient(circle at 80% 0%, rgba(2, 46, 167, .14), transparent 32%),
        #fff;
    }
    .login-card {
      width: min(460px, 100%);
      padding: 34px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 950;
      letter-spacing: -.04em;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--blue), #3157ff);
      color: #fff;
      font-size: 22px;
    }
    .brand span { color: var(--blue); }
    .brand b { color: var(--orange); }
    .login-card h1 { margin: 28px 0 8px; font-size: 30px; }
    .muted { color: var(--muted); }
    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
    }
    input, select, textarea {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }
    textarea { min-height: 84px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      border-color: #8fa0d7;
      box-shadow: 0 0 0 4px rgba(143, 160, 215, .18);
    }
    input.invalid, select.invalid, textarea.invalid {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(251, 58, 2, .12);
    }
    .form-error {
      display: block;
      margin-top: 4px;
      color: var(--red);
      font-size: 11px;
      font-weight: 800;
      text-transform: none;
    }
    .form-alert {
      padding: 10px 12px;
      border: 1px solid #ffd8cf;
      border-radius: 12px;
      color: var(--red);
      background: #fff2ef;
      font-size: 13px;
      font-weight: 850;
      text-transform: none;
    }
    .btn {
      min-height: 40px;
      padding: 10px 14px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: #f3f6ff;
      color: var(--blue);
      font-weight: 900;
    }
    .btn.primary { background: linear-gradient(135deg, var(--blue), #3157ff); color: #fff; }
    .btn.orange { background: linear-gradient(135deg, var(--orange), var(--red)); color: #fff; }
    .btn.ghost { background: #fff; border-color: var(--line); color: var(--ink); }
    .btn.danger { background: #fff2ef; color: var(--red); border-color: #ffd8cf; }
    .btn:disabled { cursor: not-allowed; opacity: .58; }
    .msg { min-height: 22px; color: var(--red); font-weight: 750; }
    .import-drop {
      display: grid;
      gap: 10px;
      padding: 18px;
      border: 1px dashed #b9c4dc;
      border-radius: 16px;
      background: #f8fbff;
    }
    .import-drop strong { color: var(--ink); font-size: 15px; }
    .import-preview-table {
      max-height: 260px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }
    .import-preview-table table { margin: 0; box-shadow: none; border: 0; }
    .import-preview-table th, .import-preview-table td { padding: 9px 10px; font-size: 12px; }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      display: none;
      max-width: 340px;
      padding: 13px 16px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--orange), var(--red));
      box-shadow: var(--shadow);
      font-weight: 850;
    }
    .toast.open { display: block; }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 224px minmax(0, 1fr);
    }
    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 16px 12px;
      color: #dce6ff;
      background: linear-gradient(180deg, #071a3d, #02112d);
      overflow-y: auto;
    }
    .side-brand {
      padding: 8px 8px 18px;
      font-size: 18px;
    }
    .nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 5px;
      padding: 10px 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #dce6ff;
      text-align: left;
      font-weight: 750;
    }
    .nav button.active { background: #244fcf; color: #fff; }
    main { min-width: 0; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 66px;
      padding: 14px 24px;
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .hamb { width: 34px; height: 34px; border: 0; background: #f4f6fb; border-radius: 9px; }
    .search {
      max-width: 460px;
      flex: 1;
      position: relative;
    }
    .search-results {
      position: absolute;
      top: 48px;
      left: 0;
      right: 0;
      z-index: 8;
      display: none;
      padding: 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .search-results.open { display: grid; gap: 8px; }
    .search-hit { display: block; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: #f8faff; color: var(--ink); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
    .search-hit:hover { background: #eef4ff; }
    .search input { padding-left: 38px; }
    .search:before {
      content: "⌕";
      position: absolute;
      left: 14px;
      top: 9px;
      color: var(--muted);
      font-size: 18px;
      z-index: 1;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--orange), var(--red));
      font-weight: 950;
    }
    .content { padding: 22px 24px 40px; }
    .section { display: none; }
    .section.active { display: block; }
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }
    h1, h2, h3 { margin: 0; }
    h1 { font-size: 22px; }
    .grid { display: grid; gap: 16px; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .stat { padding: 16px; }
    .stat p { margin: 0 0 10px; color: var(--muted); font-size: 12px; font-weight: 850; }
    .stat strong { display: block; font-size: 24px; color: var(--navy); }
    .stat small { color: var(--green); font-weight: 850; }
    .panel { padding: 16px; }
    .two-col { grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr); }
    .load-warning {
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 1px solid #ffd8cf;
      border-radius: 12px;
      color: var(--red);
      background: #fff2ef;
      font-weight: 800;
    }
    .pick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      max-height: 270px;
      overflow: auto;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbfcff;
    }
    .pick-grid label {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      text-transform: none;
      font-size: 13px;
    }
    .pick-grid input { width: auto; min-height: auto; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 720px; }
    th, td {
      padding: 13px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 13px;
      vertical-align: middle;
    }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .02em; }
    tbody tr:hover { background: #fbfcff; }
    .thumb { width: 36px; height: 44px; object-fit: contain; background: #f8f9fd; border-radius: 8px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 999px;
      color: var(--green);
      background: rgba(29, 170, 97, .1);
      font-size: 11px;
      font-weight: 900;
    }
    .pill.warn { color: #b45309; background: #fff7ed; }
    .pill.bad { color: var(--red); background: #fff2ef; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .order-stepper { display: grid; gap: 12px; margin: 8px 0 16px; }
    .order-step {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }
    .order-step.done { border-color: #bbf7d0; background: #f0fdf4; }
    .order-step.current { border-color: var(--blue); background: #eef4ff; }
    .order-step.next { border-color: #fed7aa; background: #fff7ed; }
    .step-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #eef2ff;
      color: var(--muted);
      font-weight: 900;
    }
    .order-step.done .step-dot { background: #16a34a; color: #fff; }
    .order-step.current .step-dot { background: var(--blue); color: #fff; }
    .order-step.next .step-dot { background: linear-gradient(135deg, var(--orange), var(--red)); color: #fff; }
    .step-title { font-weight: 900; color: var(--ink); text-transform: capitalize; }
    .step-meta { font-size: 12px; color: var(--muted); }
    .order-progress {
      display: flex;
      align-items: flex-start;
      gap: 0;
      margin: 4px 0 20px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .order-progress-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-width: 100px;
    }
    .order-progress-step .progress-dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #eef2ff;
      color: var(--muted);
      font-weight: 900;
      font-size: 13px;
      border: 2px solid var(--line);
    }
    .order-progress-step.done .progress-dot { background: #16a34a; border-color: #16a34a; color: #fff; }
    .order-progress-step.current .progress-dot { background: var(--blue); border-color: var(--blue); color: #fff; }
    .order-progress-step .progress-label { font-weight: 850; font-size: 13px; margin-top: 6px; text-transform: capitalize; }
    .order-progress-step .progress-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .order-progress-line {
      flex: 1;
      height: 2px;
      background: var(--line);
      margin-top: 15px;
      min-width: 20px;
    }
    .order-progress-line.done { background: #16a34a; }
    .detail-card h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      margin: 0 0 12px;
    }
    .detail-card .kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
    .detail-card .kv:last-child { border-bottom: 0; }
    .detail-card .kv span:first-child { color: var(--muted); }
    .item-detail-row { display: flex; align-items: center; gap: 10px; }
    .item-detail-row .thumb { width: 40px; height: 40px; flex-shrink: 0; }
    .item-detail-meta { font-size: 11px; color: var(--muted); line-height: 1.5; }
    .summary-line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
    .summary-line.grand { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; font-size: 15px; font-weight: 900; color: var(--navy); }
    .paid-badge { display: inline-flex; margin-top: 10px; padding: 7px 12px; border-radius: 10px; background: #f0fdf4; color: #16a34a; font-weight: 850; font-size: 12px; }
    .next-action-card { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 14px; padding: 16px; height: 100%; }
    .next-action-card p { font-size: 13px; color: var(--ink); margin: 0 0 12px; }
    .next-action-card .btn { width: 100%; }
    .next-action-card.done-card { background: #f0fdf4; border-color: #bbf7d0; }
    .order-timeline-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
    .order-timeline-item .dot { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; background: #eef2ff; color: var(--muted); flex-shrink: 0; }
    .order-timeline-item.done .dot { background: #16a34a; color: #fff; }
    .order-detail-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .brand-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
    .brand-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      padding: 16px;
    }
    .brand-card-top { width: 100%; display: flex; justify-content: flex-start; }
    .brand-logo { width: 56px; height: 56px; object-fit: contain; background: #f8f9fd; border-radius: 10px; }
    .brand-card-meta { display: flex; justify-content: space-between; width: 100%; font-size: 12px; color: var(--muted); margin: 4px 0; }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 850;
    }
    .tab.active { color: #fff; border-color: var(--orange); background: var(--orange); }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .full { grid-column: 1 / -1; }
    .wide { grid-column: span 2; }
    .upload-box {
      border: 1px dashed #cfd8ef;
      border-radius: 12px;
      padding: 14px;
      background: #fbfcff;
    }
    .preview {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      min-height: 58px;
    }
    .preview img { width: 52px; height: 52px; object-fit: contain; border-radius: 10px; background: #fff; border: 1px solid var(--line); }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(2, 8, 23, .46);
    }
    .modal.open { display: grid; }
    .modal-card {
      width: min(1120px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .28);
    }
    .modal-head {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 20px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .modal-body { padding: 18px 20px; }
    .drawer-stat {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .product-variant-wrap {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }
    .product-variant-wrap table {
      min-width: 1260px;
      table-layout: fixed;
      box-shadow: none;
    }
    .product-variant-wrap th,
    .product-variant-wrap td {
      padding: 12px 10px;
      vertical-align: top;
    }
    .product-variant-wrap th:nth-child(1),
    .product-variant-wrap td:nth-child(1) { width: 150px; }
    .product-variant-wrap th:nth-child(2),
    .product-variant-wrap td:nth-child(2) { width: 150px; }
    .product-variant-wrap th:nth-child(3),
    .product-variant-wrap td:nth-child(3) { width: 90px; }
    .product-variant-wrap th:nth-child(4),
    .product-variant-wrap td:nth-child(4),
    .product-variant-wrap th:nth-child(5),
    .product-variant-wrap td:nth-child(5),
    .product-variant-wrap th:nth-child(6),
    .product-variant-wrap td:nth-child(6),
    .product-variant-wrap th:nth-child(7),
    .product-variant-wrap td:nth-child(7) { width: 110px; }
    .product-variant-wrap th:nth-child(8),
    .product-variant-wrap td:nth-child(8) { width: 88px; }
    .product-variant-wrap th:nth-child(9),
    .product-variant-wrap td:nth-child(9) { width: 190px; }
    .product-variant-wrap th:nth-child(10),
    .product-variant-wrap td:nth-child(10) { width: 86px; text-align: center; }
    .product-variant-wrap th:nth-child(11),
    .product-variant-wrap td:nth-child(11) { width: 118px; }
    .product-variant-wrap th:nth-child(12),
    .product-variant-wrap td:nth-child(12) { width: 104px; }
    .product-variant-wrap input,
    .product-variant-wrap select {
      min-width: 0;
      min-height: 44px;
      padding: 10px;
    }
    .product-variant-wrap input[type="checkbox"] {
      width: 24px;
      height: 24px;
      min-height: 24px;
      margin-top: 8px;
      accent-color: #1473e6;
    }
    .variant-preview {
      display: grid;
      gap: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      white-space: normal;
    }
    .variant-preview b {
      color: var(--ink);
      font-size: 13px;
    }
    .mini-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
    }
    .bar { height: 9px; border-radius: 99px; background: #edf1fb; overflow: hidden; }
    .bar span { display: block; height: 100%; background: linear-gradient(135deg, var(--blue), #8fa0d7); }
    .socket-state {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: #eef4ff;
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
    }
    .socket-state::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(29, 170, 97, .12);
    }
    .socket-state.reconnecting { background: #fff7ed; color: #b45309; }
    .socket-state.reconnecting::before { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, .16); }
    .socket-state.offline { background: #fff2ef; color: var(--red); }
    .socket-state.offline::before { background: var(--red); box-shadow: 0 0 0 3px rgba(251, 58, 2, .14); }
    @media (max-width: 960px) {
      .shell { grid-template-columns: 1fr; }
      aside { position: fixed; inset: 0 auto 0 0; z-index: 30; width: 240px; transform: translateX(-100%); transition: .2s ease; }
      aside.open { transform: translateX(0); }
      .stats, .two-col, .form-grid, .drawer-stat, .two-col-detail { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
      .content { padding: 16px; }
      table { min-width: 640px; }
      .order-progress { justify-content: flex-start; }
      .order-detail-footer { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div id="loginView" class="login-wrap">
    <form id="loginForm" class="login-card">
      <div class="brand"><span class="brand-mark">V</span><span>Vypar<b>Hub</b></span></div>
      <h1>Admin Login</h1>
      <p class="muted">Use a super-admin or admin account to manage live mobile data.</p>
      <div class="grid">
        <label>Email <input id="loginEmail" value="admin@vyparhub.com" autocomplete="username" /></label>
        <label>Password <input id="loginPassword" type="password" value="Admin@123" autocomplete="current-password" /></label>
        <button class="btn primary" type="submit">Login</button>
        <div id="loginMsg" class="msg"></div>
      </div>
    </form>
  </div>

  <div id="appView" class="shell hidden">
    <aside id="sidebar">
      <div class="side-brand brand"><span>Vypar<b>Hub</b> admin</span></div>
      <nav id="nav" class="nav"></nav>
    </aside>
    <main>
      <header class="topbar">
        <button class="hamb" id="hamb">☰</button>
        <strong id="pageTitle">Dashboard</strong>
        <div class="search"><input id="globalSearch" placeholder="Search orders, users, products..." /><div id="searchResults" class="search-results"></div></div>
        <button class="btn ghost" id="refreshBtn">Refresh</button>
        <span id="socketState" class="socket-state offline">Offline</span>
        <button class="btn primary hidden" id="installBtn">Install App</button>
        <button class="btn ghost" onclick="setRoute('notifications')">🔔 <span id="bellCount"></span></button>
        <div class="avatar">A</div>
        <strong>Admin</strong>
      </header>
      <div class="content">
        <section id="dashboard" class="section active"></section>
        <section id="orders" class="section"></section>
        <section id="products" class="section"></section>
        <section id="brands" class="section"></section>
        <section id="categories" class="section"></section>
        <section id="users" class="section"></section>
        <section id="customers" class="section"></section>
        <section id="marketing" class="section"></section>
        <section id="rewards" class="section"></section>
        <section id="referrals" class="section"></section>
        <section id="home-sections" class="section"></section>
        <section id="delivery-zones" class="section"></section>
        <section id="notifications" class="section"></section>
        <section id="coupons" class="section"></section>
        <section id="banners" class="section"></section>
        <section id="reviews" class="section"></section>
        <section id="returns" class="section"></section>
        <section id="reports" class="section"></section>
        <section id="payments" class="section"></section>
        <section id="payouts" class="section"></section>
        <section id="settings" class="section"></section>
        <section id="system" class="section"></section>
        <section id="logs" class="section"></section>
        <section id="support" class="section"></section>
      </div>
    </main>
  </div>

  <div id="modal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Edit</h2>
        <button class="btn ghost" id="modalClose">Close</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const API = `${location.origin}/api`;
    const imgUrl = (path) => !path ? '' : path.startsWith('http') ? path : path.startsWith('/uploads') ? `${location.origin}${path}` : `${location.origin}/${path}`;
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const money = (value) => `₹${Number(value || 0).toLocaleString('en-IN')}`;
    const shortId = (id) => String(id || '').slice(-8).toUpperCase();
    const date = (value) => value ? new Date(value).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : 'Recent';
    const state = {
      token: localStorage.getItem('vyparhub_admin_access_token') || '',
      refreshToken: localStorage.getItem('vyparhub_admin_refresh_token') || '',
      user: JSON.parse(localStorage.getItem('vyparhub_admin_user') || 'null'),
      route: 'dashboard',
      dashboard: {},
      catalogVisibility: {},
      products: [],
      categories: [],
      brands: [],
      orders: [],
      offers: [],
      customers: [],
      reports: {},
      payments: [],
      payouts: [],
      returns: [],
      support: [],
      users: [],
      roles: [],
      loyaltyTiers: [],
      loyaltyRules: [],
      loyaltyRewards: [],
      referrals: { settings: {}, events: [] },
      homeSections: [],
      deliveryZones: [],
      notificationHistory: [],
      logs: [],
      settings: {},
      filter: 'All',
      dashboardRange: localStorage.getItem('vyparhub_dashboard_range') || 'month',
      dashboardLastUpdated: null,
      searchResults: null,
      socket: null,
      socketStatus: 'offline',
      liveNotifications: 0,
      loadErrors: [],
      selected: { products: new Set(), categories: new Set(), brands: new Set() },
    };
    const navItems = [
      ['dashboard', '⌂', 'Dashboard'], ['orders', '▣', 'Orders'], ['products', '▤', 'Products'],
      ['brands', '◇', 'Brands'], ['categories', '▦', 'Categories'], ['users', '♙', 'Users'], ['customers', '☻', 'Customers'], ['marketing', '↗', 'Marketing'],
      ['rewards', '☆', 'Rewards & Wallet'], ['referrals', '⛓', 'Referrals'], ['home-sections', '▣', 'Home Sections'], ['delivery-zones', '⌖', 'Delivery Zones'], ['notifications', '◉', 'Notifications'],
      ['coupons', '%', 'Coupons'], ['banners', '▭', 'Banners'], ['reviews', '★', 'Reviews'],
      ['returns', '↩', 'Returns & Refunds'], ['reports', '◌', 'Reports'], ['payments', '₹', 'Payments'],
      ['payouts', '⇄', 'Payouts'], ['settings', '⚙', 'Settings'], ['logs', '☷', 'Logs'], ['support', '?', 'Support'], ['logout', '↪', 'Logout'],
    ];
    const $ = (id) => document.getElementById(id);
    const unwrap = (json) => {
      if (!json.success) throw new Error(json.error?.message || 'Request failed');
      return json.data;
    };
    function clearSession(message = '') {
      localStorage.removeItem('vyparhub_admin_access_token');
      localStorage.removeItem('vyparhub_admin_refresh_token');
      localStorage.removeItem('vyparhub_admin_user');
      state.token = '';
      state.refreshToken = '';
      state.user = null;
      $('appView').classList.add('hidden');
      $('loginView').classList.remove('hidden');
      $('loginMsg').textContent = message;
    }
    async function request(path, options = {}) {
      const headers = options.body instanceof FormData ? {} : { 'Content-Type': 'application/json' };
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      const res = await fetch(`${API}${path}`, { ...options, headers: { ...headers, ...(options.headers || {}) } });
      const json = await res.json().catch(() => ({}));
      const message = json.error?.message || `HTTP ${res.status}`;
      const sessionFailed = (res.status === 401 || /invalid token|jwt|missing token|admin session/i.test(message)) && !path.startsWith('/admin/auth/');
      if (sessionFailed) {
        clearSession('Session expired. Please login again.');
        throw new Error('Session expired. Please login again.');
      }
      if (!res.ok || json.success === false) {
        const error = new Error(json.error?.message || `HTTP ${res.status}`);
        error.details = json.error?.details || {};
        error.status = res.status;
        throw error;
      }
      return unwrap(json);
    }
    function statusPill(status) {
      const s = String(status || 'active');
      const lower = s.toLowerCase();
      const cls = lower.includes('cancel') || lower.includes('reject') || lower.includes('blocked') ? 'bad' : lower.includes('pending') ? 'warn' : '';
      return `<span class="pill ${cls}">${s}</span>`;
    }
    const slugify = (value) => String(value || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    const moduleForRoute = (route) => ({ brands: 'brands', marketing: 'marketing', system: 'settings', referrals: 'rewards', 'home-sections': 'merchandising', 'delivery-zones': 'merchandising', notifications: 'marketing' }[route] || route);
    function can(module, action = 'view') {
      if (!state.user) return false;
      if (state.user.role === 'Super Admin') return true;
      return (state.user.permissions || []).some((p) => p.module === module && p.action === action && p.allowed !== false);
    }
    function canRoute(route) {
      if (route === 'logout') return true;
      return can(moduleForRoute(route), 'view');
    }
    function rows(items, empty, render) {
      return items.length ? items.map(render).join('') : `<tr><td colspan="8" class="muted">${empty}</td></tr>`;
    }
    function loadWarning() {
      if (!state.loadErrors.length) return '';
      return `<div class="load-warning">Some admin data could not load. ${state.loadErrors[0]}</div>`;
    }
    function renderNav() {
      $('nav').innerHTML = navItems.filter(([id]) => canRoute(id)).map(([id, icon, label]) => `
        <button class="${state.route === id ? 'active' : ''}" data-route="${id}">
          <span>${icon}</span><span>${label}</span>
        </button>`).join('');
      document.querySelectorAll('[data-route]').forEach((btn) => btn.onclick = () => {
        const route = btn.dataset.route;
      if (route === 'logout') return logout();
        if (!canRoute(route)) return alert('You do not have permission to open this page.');
        setRoute(route);
      });
    }
    function setRoute(route) {
      if (!canRoute(route)) route = 'dashboard';
      state.route = route;
      state.filter = 'All';
      document.querySelectorAll('.section').forEach((el) => el.classList.toggle('active', el.id === route));
      $('pageTitle').textContent = navItems.find((x) => x[0] === route)?.[2] || 'Dashboard';
      $('sidebar').classList.remove('open');
      renderNav();
      render();
    }
    function renderDashboard() {
      const d = state.dashboard;
      const revenue = Number(d.orders?.gross_sales ?? d.orders?.revenue ?? 0);
      const pendingRevenue = Number(d.orders?.pending_revenue || 0);
      const cancelledValue = Number(d.orders?.cancelled_value || 0);
      const refundedAmount = Number(d.orders?.refunded_amount || 0);
      const netSales = Number(d.orders?.net_sales ?? (revenue - refundedAmount));
      const orders = Number(d.orders?.count || state.orders.length);
      const customers = state.customers.length;
      const profit = Number(d.products?.margin || 0);
      const lastUpdated = state.dashboardLastUpdated || d.orders?.last_updated_at || new Date().toISOString();
      const visibility = state.catalogVisibility || {};
      const hiddenProducts = Number(visibility.hidden_products || 0);
      const visibilitySamples = visibility.samples || [];
      $('dashboard').innerHTML = `
        <div class="title-row"><h1>Dashboard</h1><div class="actions"><span class="socket-state">Last updated ${date(lastUpdated)}</span><select id="dashboardRange" onchange="setDashboardRange(this.value)"><option value="today">Today</option><option value="week">This Week</option><option value="month">This Month</option></select><button class="btn primary" onclick="refreshDashboardOnly()">Refresh Data</button></div></div>
        <div class="grid stats">
          <div class="card stat"><p>Total Sales</p><strong>${money(revenue)}</strong><small>Delivered orders only</small></div>
          <div class="card stat"><p>Net Sales</p><strong>${money(netSales)}</strong><small>Delivered minus refunds</small></div>
          <div class="card stat"><p>Pending Revenue</p><strong>${money(pendingRevenue)}</strong><small>Placed to out-for-delivery</small></div>
          <div class="card stat"><p>Refunded Amount</p><strong>${money(refundedAmount)}</strong><small>Approved refund liability</small></div>
          <div class="card stat"><p>Total Orders</p><strong>${orders}</strong><small>All order statuses</small></div>
          <div class="card stat"><p>Total Customers</p><strong>${customers}</strong><small>Registered retailers</small></div>
          <div class="card stat"><p>Cancelled Orders</p><strong>${d.orders?.cancelled_count || 0}</strong><small>${money(cancelledValue)} not counted in sales</small></div>
          <div class="card stat"><p>Total Margin</p><strong>${money(profit)}</strong><small>Catalog margin pool</small></div>
        </div>
        <div class="card panel" style="margin-top:16px">
          <div class="title-row"><h2>Catalog Visibility</h2><span class="muted">Customer app sanity check</span></div>
          <div class="grid stats">
            <div class="card stat"><p>Visible Products</p><strong>${visibility.visible_products || 0}</strong><small>Returned by public catalog APIs</small></div>
            <div class="card stat"><p>Hidden Products</p><strong>${hiddenProducts}</strong><small>${hiddenProducts ? 'Fix before importing more files' : 'Catalog is visible'}</small></div>
            <div class="card stat"><p>Category Issues</p><strong>${visibility.category_issues || 0}</strong><small>Missing or inactive categories</small></div>
            <div class="card stat"><p>Brand Issues</p><strong>${visibility.brand_issues || 0}</strong><small>Missing or inactive brands</small></div>
            <div class="card stat"><p>Variant Issues</p><strong>${visibility.variant_issues || 0}</strong><small>No active pack/variant</small></div>
          </div>
          ${hiddenProducts ? table('Hidden Product Samples', ['Product','SKU','Reason'], rows(visibilitySamples, 'No hidden products', (p) => `<tr><td>${p.name_en || '-'}</td><td>${p.sku || '-'}</td><td>${p.reason}</td></tr>`)) : '<p class="muted">All checked products are visible to the customer app.</p>'}
        </div>
        <div class="grid two-col" style="margin-top:16px">
          <div class="card panel">
            <div class="title-row"><h2>Sales Overview</h2><span class="muted">Last 14 days</span></div>
            <div class="grid">${(state.reports.sales || []).map((s) => `<div><div class="title-row"><b>${s.label}</b><span>${money(s.total)}</span></div><div class="bar"><span style="width:${Math.min(100, Number(s.total || 0) / Math.max(revenue, 1) * 260)}%"></span></div></div>`).join('') || '<p class="muted">No sales yet.</p>'}</div>
          </div>
          <div class="card panel">
            <div class="title-row"><h2>Order Status</h2><span>${orders} total</span></div>
            ${['placed','confirmed','packed','shipped','out_for_delivery','delivered','partially_refunded','refunded','cancelled'].map((s) => {
              const count = state.orders.filter((o) => String(o.status).toLowerCase() === s).length;
              return `<div class="title-row"><span>${s}</span><b>${count}</b></div><div class="bar"><span style="width:${orders ? count / orders * 100 : 0}%"></span></div>`;
            }).join('')}
          </div>
        </div>
        <div class="grid two-col" style="margin-top:16px">
          <div class="card panel">${table('Top Selling Products', ['Product','Brand','Stock','Margin'], rows((state.reports.topProducts || state.products).slice(0,5), 'No products', (p) => `<tr><td><img class="thumb" src="${imgUrl(p.image_url)}" /> ${p.name_en || p.name}</td><td>${p.brand || '-'}</td><td>${p.stock || p.sold || 0}</td><td>${money((p.mrp || 0) - (p.buy_price || 0))}</td></tr>`))}</div>
          <div class="card panel">${table('Recent Orders', ['Order','Customer','Amount','Status'], rows(state.orders.slice(0,6), 'No orders', (o) => `<tr><td>#${shortId(o.id)}</td><td>${o.customer || o.user_id || '-'}</td><td>${money(o.total)}</td><td>${statusPill(o.status)}</td></tr>`))}</div>
        </div>`;
      const rangeSelect = $('dashboardRange');
      if (rangeSelect) rangeSelect.value = state.dashboardRange;
    }
    function table(title, heads, body, action = '') {
      return `<div class="title-row"><h2>${title}</h2>${action}</div><div class="table-wrap"><table><thead><tr>${heads.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
    }
    function sectionHeader(title, action = '') {
      return `<div class="title-row"><h1>${title}</h1><div class="actions">${action}</div></div>`;
    }
    function resetSelection(type) {
      state.selected[type] = new Set();
    }
    function selectedIds(type) {
      return [...(state.selected[type] || new Set())];
    }
    function toggleSelection(type, id, checked) {
      const set = state.selected[type] || new Set();
      if (checked) set.add(String(id));
      else set.delete(String(id));
      state.selected[type] = set;
      render();
    }
    function toggleAllSelection(type, ids, checked) {
      state.selected[type] = checked ? new Set(ids.map(String)) : new Set();
      render();
    }
    function bulkDeleteButton(type, endpoint, label, cascadeCopy = '') {
      if (!can(type, 'delete')) return '';
      const count = selectedIds(type).length;
      return `<button class="btn danger" ${count ? '' : 'disabled'} onclick="bulkDeleteCatalog('${type}','${endpoint}','${label}','${esc(cascadeCopy)}')">Delete Selected${count ? ` (${count})` : ''}</button>`;
    }
    function renderOrders() {
      const filters = ['All', 'Placed', 'Confirmed', 'Packed', 'Shipped', 'Out_for_delivery', 'Delivered', 'Partially_refunded', 'Refunded', 'Cancelled'];
      const q = $('globalSearch')?.value?.toLowerCase() || '';
      const data = state.orders.filter((o) => (state.filter === 'All' || String(o.status).toLowerCase() === state.filter.toLowerCase()) && JSON.stringify(o).toLowerCase().includes(q));
      $('orders').innerHTML = sectionHeader('Orders', '<button class="btn ghost" onclick="exportCsv(\'orders\')">Export</button>') +
        `${loadWarning()}<div class="toolbar"><div class="tabs">${filters.map((f) => `<button class="tab ${state.filter === f ? 'active' : ''}" onclick="state.filter='${f}';renderOrders()">${f}</button>`).join('')}</div><button class="btn ghost" onclick="openFilters('orders')">Filters</button></div>
        <div class="card panel">${table('', ['Order ID','Customer','Amount','Payment','Status','Date','Action'], rows(data, 'No orders found', (o) => `
          <tr><td><button class="btn ghost" onclick="openOrderDetail('${o.id}')">#${shortId(o.id)}</button></td><td>${o.customer || o.user_id || '-'}</td><td>${money(o.total)}</td><td>${o.payment_mode || 'COD'}</td><td>${statusPill(o.status)}</td><td>${date(o.created_at)}</td><td class="actions"><button class="btn ghost" onclick="openOrderDetail('${o.id}')">View / Update</button></td></tr>`))}</div>`;
    }
    function catalogStats(kind) {
      if (kind === 'products') {
        const list = state.products;
        const active = list.filter((p) => p.is_active !== false).length;
        const outOfStock = list.filter((p) => {
          const first = (p.variants || [])[0] || {};
          return Number(first.stock_quantity ?? p.stock ?? 0) <= 0;
        }).length;
        const lowStock = list.filter((p) => {
          const first = (p.variants || [])[0] || {};
          const stock = Number(first.stock_quantity ?? p.stock ?? 0);
          const alert = Number(first.low_stock_alert ?? 0);
          return stock > 0 && alert > 0 && stock <= alert;
        }).length;
        const totalValue = list.reduce((sum, p) => {
          const first = (p.variants || [])[0] || {};
          const cost = Number(first.cost_price ?? p.buy_price ?? 0);
          const stock = Number(first.stock_quantity ?? p.stock ?? 0);
          return sum + cost * stock;
        }, 0);
        return `<div class="grid stats" style="margin-bottom:16px">
          <div class="card stat"><p>Total Products</p><strong>${list.length}</strong></div>
          <div class="card stat"><p>Active Products</p><strong>${active}</strong><small>${list.length ? Math.round(active / list.length * 100) : 0}% of total</small></div>
          <div class="card stat"><p>Out of Stock</p><strong>${outOfStock}</strong><small>${list.length ? Math.round(outOfStock / list.length * 100) : 0}% of total</small></div>
          <div class="card stat"><p>Low Stock</p><strong>${lowStock}</strong><small>${list.length ? Math.round(lowStock / list.length * 100) : 0}% of total</small></div>
          <div class="card stat"><p>Total Value</p><strong>${money(totalValue)}</strong><small>Inventory value</small></div>
        </div>`;
      }
      if (kind === 'categories') {
        const list = state.categories;
        const active = list.filter((c) => c.is_active !== false).length;
        const productCounts = state.products.filter((p) => p.is_active !== false).reduce((acc, p) => (acc[p.category_id] = (acc[p.category_id] || 0) + 1, acc), {});
        const top = list.slice().sort((a, b) => (productCounts[b.id] || 0) - (productCounts[a.id] || 0))[0];
        return `<div class="grid stats" style="margin-bottom:16px">
          <div class="card stat"><p>Total Categories</p><strong>${list.length}</strong></div>
          <div class="card stat"><p>Active Categories</p><strong>${active}</strong><small>${list.length ? Math.round(active / list.length * 100) : 0}% of total</small></div>
          <div class="card stat"><p>Inactive Categories</p><strong>${list.length - active}</strong></div>
          <div class="card stat"><p>Total Products</p><strong>${state.products.filter((p) => p.is_active !== false).length}</strong><small>Across all categories</small></div>
          <div class="card stat"><p>Top Category</p><strong>${top?.name_en || '-'}</strong><small>${top ? `${productCounts[top.id] || 0} products` : ''}</small></div>
        </div>`;
      }
      if (kind === 'brands') {
        const list = state.brands;
        const active = list.filter((b) => (b.status || (b.is_active ? 'active' : 'inactive')) !== 'inactive').length;
        const productCounts = state.products.filter((p) => p.is_active !== false).reduce((acc, p) => (acc[p.brand_id] = (acc[p.brand_id] || 0) + 1, acc), {});
        const top = list.slice().sort((a, b) => (productCounts[b.id] || 0) - (productCounts[a.id] || 0))[0];
        return `<div class="grid stats" style="margin-bottom:16px">
          <div class="card stat"><p>Total Brands</p><strong>${list.length}</strong></div>
          <div class="card stat"><p>Active Brands</p><strong>${active}</strong><small>${list.length ? Math.round(active / list.length * 100) : 0}% of total</small></div>
          <div class="card stat"><p>Inactive Brands</p><strong>${list.length - active}</strong></div>
          <div class="card stat"><p>Total Products</p><strong>${state.products.filter((p) => p.is_active !== false).length}</strong><small>Across all brands</small></div>
          <div class="card stat"><p>Top Brand</p><strong>${top?.name || '-'}</strong><small>${top ? `${productCounts[top.id] || 0} products` : ''}</small></div>
        </div>`;
      }
      return '';
    }
    function renderProducts() {
      const q = $('globalSearch')?.value?.toLowerCase() || '';
      const data = state.products.filter((p) => {
        const variantSkus = (p.variants || []).map((v) => v.sku).join(' ');
        const haystack = `${p.name_en || ''} ${p.sku || ''} ${p.brand_name || p.brand || ''} ${variantSkus}`.toLowerCase();
        return p.is_active !== false && (!q || haystack.includes(q));
      });
      const dataIds = data.map((p) => String(p.id));
      const allChecked = dataIds.length && dataIds.every((id) => state.selected.products.has(id));
      $('products').innerHTML = sectionHeader('Products', `${bulkDeleteButton('products','/admin/products/bulk-delete','products')}${can('products','delete') ? '<button class="btn danger" onclick="openResetCatalog()">Reset Catalog Data</button>' : ''}${can('products','export') ? '<button class="btn ghost" onclick="exportProductsCsv()">Export CSV</button>' : ''}${can('products','import') ? '<button class="btn ghost" onclick="downloadImportTemplate(\'products\')">Template</button><button class="btn ghost" onclick="openCatalogImport(\'products\')">Import CSV</button>' : ''}${can('products','add') ? '<button class="btn primary" onclick="openProduct()">+ Add Product</button>' : ''}`) +
        catalogStats('products') +
        `<div class="card panel">${table('', [`<input type="checkbox" ${allChecked ? 'checked' : ''} onchange="toggleAllSelection('products', ${esc(JSON.stringify(dataIds))}, this.checked)" />`,'Product','Category','Price','MRP','Stock','Status','Action'], rows(data, 'No products found', (p) => {
          const cat = state.categories.find((c) => c.id === p.category_id)?.name_en || '-';
          const first = (p.variants || [])[0] || {};
          const pack = Math.max(1, Number(first.pack_quantity ?? first.packQuantity ?? 1));
          const unitMrp = Number(first.mrp || p.mrp || 0);
          const totalMrp = unitMrp * pack;
          const selling = Number(first.selling_price || p.starting_price || p.buy_price || 0);
          const discount = totalMrp > 0 ? Math.max(0, Math.round(((totalMrp - selling) / totalMrp) * 100)) : 0;

      function toLocalInput(value) {
        if (!value) return '';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '';
        const offset = date.getTimezoneOffset() * 60000;
        return new Date(date.getTime() - offset).toISOString().slice(0, 16);
      }

      function homeSectionPayload(form) {
        let config = {};
        const rawConfig = form.config.value.trim();
        if (rawConfig) {
          try {
            config = JSON.parse(rawConfig);
          } catch (error) {
            throw new Error('Config must be valid JSON.');
          }
        }
        return {
          title: form.title.value.trim(),
          sectionKey: form.section_key.value.trim(),
          type: form.type.value,
          position: Number(form.position.value || 0),
          displayOrder: Number(form.position.value || 0),
          enabled: form.enabled.value === 'true',
          active: form.enabled.value === 'true',
          startsAt: form.starts_at.value ? new Date(form.starts_at.value).toISOString() : null,
          endsAt: form.ends_at.value ? new Date(form.ends_at.value).toISOString() : null,
          config,
        };
      }

      async function moveHomeSection(id, delta) {
        const section = state.homeSections.find((item) => item.id === id);
        if (!section) return;
        const nextPosition = Number(section.position ?? section.display_order ?? 0) + delta;
        const payload = {
          ...section,
          sectionKey: section.section_key,
          displayOrder: nextPosition,
          position: nextPosition,
          enabled: section.enabled !== false && section.active !== false,
          active: section.enabled !== false && section.active !== false,
        };
        await api('/admin/home-sections/' + id, { method: 'PUT', body: JSON.stringify(payload) });
        await loadAdminData();
        renderHomeSections();
      }

      function renderHomeSections() {
        const list = state.homeSections || [];
        const rows = list
          .slice()
          .sort((a, b) => Number(a.position ?? a.display_order ?? 0) - Number(b.position ?? b.display_order ?? 0))
          .map((section) => {
            const items = Array.isArray(section.items) ? section.items.length : Number(section.item_count || 0);
            const status = section.enabled === false || section.active === false ? 'Inactive' : 'Active';
            const position = Number(section.position ?? section.display_order ?? 0);
            return `<tr>
              <td>
                <strong>\${escapeHtml(section.title || section.section_key || 'Untitled')}</strong>
                <div class="muted">\${escapeHtml(section.section_key || '')}</div>
              </td>
              <td>\${escapeHtml(section.type || 'product_carousel')}</td>
              <td>\${items}</td>
              <td>\${position}</td>
              <td><span class="badge \${status === 'Active' ? 'success' : 'muted'}">\${status}</span></td>
              <td class="actions-cell">
                <button class="btn ghost small" onclick="moveHomeSection('\${section.id}', -1)">Up</button>
                <button class="btn ghost small" onclick="moveHomeSection('\${section.id}', 1)">Down</button>
                <button class="btn ghost small" onclick="openHomeSection('\${section.id}')">Edit</button>
                <button class="btn danger small" onclick="deleteHomeSection('\${section.id}')">Delete</button>
              </td>
            </tr>`;
          })
          .join('');
        $('home-sections').innerHTML = `
          <section class="page-head">
            <div>
              <h1>Home Sections</h1>
              <p class="muted">Control the homepage rails, banners, category grids and featured product carousels shown in the mobile app.</p>
            </div>
            <button class="btn primary" onclick="openHomeSection()">+ Add Section</button>
          </section>
          <div class="card table-card">
            <table>
              <thead><tr><th>Section</th><th>Type</th><th>Items</th><th>Position</th><th>Status</th><th>Action</th></tr></thead>
              <tbody>\${rows || '<tr><td colspan="6">No home sections found</td></tr>'}</tbody>
            </table>
          </div>
        `;
      }

    async function refresh() {
      const loaders = [
        ['dashboard', 'dashboard', 'view', `/admin/dashboard?range=${encodeURIComponent(state.dashboardRange)}`, {}],
        ['catalogVisibility', 'products', 'view', '/admin/catalog/visibility', {}],
        ['categories', 'categories', 'view', '/admin/categories', []],
        ['products', 'products', 'view', '/admin/products', []],
        ['orders', 'orders', 'view', '/admin/orders', []],
        ['offers', 'coupons', 'view', '/admin/offers', []],
        ['brands', 'brands', 'view', '/admin/brands', []],
        ['customers', 'customers', 'view', '/admin/customers', []],
        ['reports', 'reports', 'view', '/admin/reports', {}],
        ['payments', 'payments', 'view', '/admin/payments', []],
        ['payouts', 'payouts', 'view', '/admin/payouts', []],
        ['returns', 'returns', 'view', '/admin/returns', []],
        ['support', 'support', 'view', '/admin/support', []],
        ['users', 'users', 'view', '/admin/users', []],
        ['roles', 'users', 'view', '/admin/roles', []],
        ['logs', 'logs', 'view', '/admin/logs', []],
        ['settings', 'settings', 'view', '/admin/settings', {}],
        ['loyaltyTiers', 'rewards', 'view', '/admin/loyalty/tiers', []],
        ['loyaltyRules', 'rewards', 'view', '/admin/loyalty/rules', []],
        ['loyaltyRewards', 'rewards', 'view', '/admin/loyalty/rewards', []],
        ['referrals', 'rewards', 'view', '/admin/referrals', { settings: {}, events: [] }],
        ['homeSections', 'merchandising', 'view', '/admin/home-sections', []],
        ['deliveryZones', 'merchandising', 'view', '/admin/delivery-zones', []],
        ['notificationHistory', 'marketing', 'view', '/admin/notifications', []],
      ];
      const results = await Promise.allSettled(loaders.map(([, module, action, path, fallback]) =>
        can(module, action) ? request(path) : Promise.resolve(fallback)
      ));
      const next = {};
      const loadErrors = [];
      results.forEach((result, index) => {
        const [key,,,, fallback] = loaders[index];
        if (result.status === 'fulfilled') {
          next[key] = result.value;
        } else {
          next[key] = fallback;
          loadErrors.push(`${key}: ${result.reason?.message || 'failed'}`);
        }
      });
      Object.assign(state, next, { loadErrors, dashboardLastUpdated: new Date().toISOString() });
      render();
      if (loadErrors.length && state.token) showToast(`Some data could not load: ${loadErrors[0]}`);
    }

    function validNextStatuses(current) {
      const flow = ['placed','confirmed','packed','shipped','out_for_delivery','delivered'];
      const normalized = String(current || 'placed').toLowerCase();
      if (['delivered', 'cancelled'].includes(normalized)) return [];
      const index = flow.indexOf(normalized);
      return [...(index >= 0 && flow[index + 1] ? [flow[index + 1]] : []), 'cancelled'];
    }
    const orderFlow = ['placed','confirmed','packed','shipped','out_for_delivery','delivered'];
    const orderLabel = (status) => String(status || '').replaceAll('_', ' ');
    function nextOrderStatus(current) {
      const normalized = String(current || 'placed').toLowerCase();
      if (['delivered', 'cancelled', 'partially_refunded', 'refunded'].includes(normalized)) return null;
      const index = orderFlow.indexOf(normalized);
      return index >= 0 ? orderFlow[index + 1] || null : 'confirmed';
    }
    function canCancelOrder(current) {
      return !['delivered', 'cancelled', 'partially_refunded', 'refunded'].includes(String(current || '').toLowerCase());
    }
    function isPaidOrder(order) {
      const mode = String(order.payment_mode || 'cod').toLowerCase();
      const paymentStatus = String(order.payment_status || '').toLowerCase();
      return mode !== 'cod' || ['paid', 'captured', 'success', 'completed'].includes(paymentStatus);
    }
    function refundedTotal(order) {
      const direct = Number(order.refunded_total || 0);
      const fromRows = state.returns
        .filter((item) => item.order_id === order.id && ['processed', 'pending', 'credited_to_wallet', 'store_credit_issued', 'pending_manual_gateway_refund'].includes(String(item.status).toLowerCase()))
        .reduce((sum, item) => sum + Number(item.total || 0), 0);
      return Math.max(direct, fromRows);
    }
    function remainingRefundable(order) {
      return Math.max(0, Number(order.total || 0) - refundedTotal(order));
    }
    function canRefundOrder(order) {
      const status = String(order.status || '').toLowerCase();
      if (status === 'refunded') return false;
      if (status === 'cancelled' && !isPaidOrder(order)) return false;
      return ['delivered', 'partially_refunded', 'cancelled'].includes(status) && remainingRefundable(order) > 0;
    }
    function orderStepper(o) {
      const normalized = String(o.status || 'placed').toLowerCase();
      const history = o.status_history || [];
      const currentIndex = orderFlow.indexOf(normalized);
      const next = nextOrderStatus(normalized);
      return `<div class="order-stepper">${orderFlow.map((status, index) => {
        const hit = history.find((h) => h.status === status);
        const cls = normalized === 'cancelled'
          ? ''
          : status === next
            ? 'next'
            : index < currentIndex || hit
              ? 'done'
              : index === currentIndex
                ? 'current'
                : '';
        const marker = cls === 'done' ? '&#10003;' : index + 1;
        return `<div class="order-step ${cls}">
          <span class="step-dot">${marker}</span>
          <span><span class="step-title">${orderLabel(status)}</span><br><span class="step-meta">${hit ? date(hit.changed_at) : status === next ? 'Next allowed step' : ''}</span></span>
          ${status === next ? `<button class="btn orange" onclick="updateOrder('${o.id}', '${status}')">Mark ${orderLabel(status)}</button>` : ''}
        </div>`;
      }).join('')}${['cancelled','partially_refunded','refunded'].includes(normalized) ? `<div class="order-step current"><span class="step-dot">!</span><span><span class="step-title">${orderLabel(normalized)}</span><br><span class="step-meta">Managed by refund/cancel workflow.</span></span></div>` : ''}</div>`;
    }
    function orderProgressBar(o) {
      const normalized = String(o.status || 'placed').toLowerCase();
      const history = o.status_history || [];
      const currentIndex = orderFlow.indexOf(normalized);
      const isTerminalIssue = ['cancelled', 'partially_refunded', 'refunded'].includes(normalized);
      return `<div class="order-progress">${orderFlow.map((status, index) => {
        const hit = history.find((h) => h.status === status);
        const done = !isTerminalIssue && (index < currentIndex || Boolean(hit) || index === currentIndex);
        const isCurrent = !isTerminalIssue && index === currentIndex && !hit;
        const cls = done ? 'done' : isCurrent ? 'current' : '';
        const marker = done ? '&#10003;' : index + 1;
        const connector = index < orderFlow.length - 1 ? `<span class="order-progress-line ${index < currentIndex && !isTerminalIssue ? 'done' : ''}"></span>` : '';
        return `<div class="order-progress-step ${cls}">
          <span class="progress-dot">${marker}</span>
          <span class="progress-label">${orderLabel(status)}</span>
          <span class="progress-meta">${hit ? date(hit.changed_at) : '&ndash;'}</span>

    function parseCsvRows(csv) {
      const lines = String(csv || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter((line) => line.trim());
      if (!lines.length) return { headers: [], rows: [], errors: [{ rowNumber: 1, reason: 'No content found.' }] };

        const cells = [];
        let current = '';
        let quoted = false;
        for (let i = 0; i < line.length; i += 1) {
          const ch = line[i];
          if (ch === '"' && quoted && line[i + 1] === '"') { current += '"'; i += 1; continue; }
          if (ch === '"') { quoted = !quoted; continue; }
          if (ch === ',' && !quoted) { cells.push(current.trim()); current = ''; continue; }

        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array' });
        return workbook.SheetNames
          .map((sheetName) => XLSX.utils.sheet_to_csv(workbook.Sheets[sheetName]))
          .filter((csv) => parseCsvRows(csv).rows.length);

      if (ext === 'csv') return [await file.text()];
      throw new Error('Choose .csv or .xlsx file(s).');

      if (event === 'order.created' || event === 'order.status_changed') await refreshOrderOnly(payload.orderId);
      if ((event === 'refund.created' || event === 'refund.status_changed') && payload.orderId) await refreshOrderOnly(payload.orderId);
      if (event === 'refund.created' || event === 'refund.status_changed') await refreshReturnsOnly();
      if (event === 'notification.created') await refreshNotificationsOnly();
      if (event === 'dashboard.updated' || event === 'order.created' || event === 'order.status_changed' || event === 'refund.created' || event === 'refund.status_changed') {
        await refreshDashboardOnly();
      }
      if (['catalog.updated','product.created','product.updated','product.deleted','category.updated','category.deleted','brand.updated','brand.deleted','home_section.updated'].includes(event)) {
        await refreshCatalogVisibilityOnly();
      }
      if (event === 'low_stock.alert' && state.route === 'products') renderProducts();
    }
    function connectAdminSocket() {
      if (!state.token || !window.io) return;
      if (state.socket) state.socket.disconnect();
      updateSocketState('reconnecting', 'Connecting...');
      state.socket = io('/admin', {
        auth: { token: state.token },
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 800,
        reconnectionDelayMax: 10000,
      });
      ['order.created','order.updated','order.status_changed','refund.created','refund.status_changed','dashboard.updated','low_stock.alert','notification.created','catalog.updated','product.created','product.updated','product.deleted','category.updated','category.deleted','brand.updated','brand.deleted','home_section.updated'].forEach((event) => {
        state.socket.on(event, (payload) => refreshForEvent(event, payload || {}));
      });
      state.socket.on('connect', () => updateSocketState('connected', 'Live'));
      state.socket.on('disconnect', () => updateSocketState('offline', 'Offline'));
      state.socket.io.on('reconnect_attempt', () => updateSocketState('reconnecting', 'Reconnecting...'));
      state.socket.io.on('reconnect_failed', () => updateSocketState('offline', 'Offline'));
      state.socket.on('connect_error', (error) => {
        updateSocketState('reconnecting', 'Reconnecting...');
        console.warn('Admin socket:', error.message);
      });
    }
    function logout() {
      request('/admin/auth/logout', { method: 'POST', body: JSON.stringify({ refreshToken: state.refreshToken }) }).catch(() => {});
      if (state.socket) state.socket.disconnect();
      state.socket = null;
      clearSession('');
    }
    $('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      $('loginMsg').textContent = '';
      try {
        const data = await request('/admin/auth/login', { method: 'POST', body: JSON.stringify({ email: $('loginEmail').value.trim(), password: $('loginPassword').value }) });
        state.token = data.accessToken; state.refreshToken = data.refreshToken; state.user = data.admin;
        localStorage.setItem('vyparhub_admin_access_token', state.token);
        localStorage.setItem('vyparhub_admin_refresh_token', state.refreshToken);
        localStorage.setItem('vyparhub_admin_user', JSON.stringify(state.user));
        $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
        connectAdminSocket();
        renderNav(); await refresh();
      } catch (error) { $('loginMsg').textContent = error.message; }
    };
    $('hamb').onclick = () => $('sidebar').classList.toggle('open');
    $('refreshBtn').onclick = refresh;
    $('modalClose').onclick = closeModal;
    $('modal').onclick = (e) => { if (e.target.id === 'modal') closeModal(); };
    let searchTimer = null;
    $('globalSearch').oninput = () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(runGlobalSearch, 250);
    };
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      $('installBtn').classList.remove('hidden');
    });
    $('installBtn').onclick = async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      $('installBtn').classList.add('hidden');
    };
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/admin/sw.js', { scope: '/admin/' }).catch(() => {});
      });
    }
    renderNav();
    if (state.token) {
      $('loginView').classList.add('hidden');
      $('appView').classList.remove('hidden');
      connectAdminSocket();
      refresh();
    }
  </script>
</body>
</html>
